<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worker Dashboard - Chore Planner</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      background: #f4f1ec;
      font-family: "Sora", sans-serif;
    }
    .navbar-custom {
      background: linear-gradient(135deg, #b45309 0%, #a84e0a 100%);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .navbar-brand {
      font-weight: 700;
      font-size: 20px;
      color: white !important;
    }
    .btn-logout {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
    }
    .btn-logout:hover {
      background: rgba(255, 255, 255, 0.3);
      color: white;
    }
    .dashboard-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 20px;
    }
    .welcome-section {
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 30px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    .welcome-section h1 {
      color: #b45309;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .card-custom {
      background: white;
      border: 1px solid #e5dfd6;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    .card-custom h3 {
      color: #b45309;
      margin-bottom: 20px;
      font-weight: 600;
      font-size: 20px;
      border-bottom: 2px solid #b45309;
      padding-bottom: 12px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: linear-gradient(135deg, #fef9f3, #f9ede4);
      border: 1px solid #f5ddc7;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }
    .stat-card h4 {
      color: #b45309;
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 28px;
    }
    .stat-card p {
      color: #6b6b6b;
      margin: 0;
      font-size: 13px;
    }
    .chore-card {
      background: linear-gradient(135deg, #ffffff, #fffbf5);
      border: 1px solid #e5dfd6;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 15px;
      transition: all 0.3s;
    }
    .chore-card:hover {
      box-shadow: 0 4px 12px rgba(180, 83, 9, 0.1);
      transform: translateY(-2px);
    }
    .chore-card h5 {
      color: #b45309;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .chore-card p {
      margin: 6px 0;
      color: #6b6b6b;
      font-size: 14px;
    }
    .chore-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
    }
    .badge-pending {
      background: #fef3c7;
      color: #92400e;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-completed {
      background: #d1fae5;
      color: #065f46;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    .btn-complete {
      background: #b45309;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-complete:hover {
      background: #92400e;
      transform: translateY(-2px);
      color: white;
    }
    .btn-complete:disabled {
      background: #c1c1c1;
      cursor: not-allowed;
      transform: none;
    }
    .btn-group-filter {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn-filter {
      padding: 8px 16px;
      border: 2px solid #b45309;
      background: white;
      color: #b45309;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }
    .btn-filter.active {
      background: #b45309;
      color: white;
    }
    .alert {
      border: none;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #6b6b6b;
    }
    .empty-state p {
      margin-top: 10px;
      font-size: 16px;
    }
    .queries-panel {
      position: fixed;
      top: 72px;
      right: 20px;
      width: min(450px, calc(100vw - 40px));
      max-height: 75vh;
      background: white;
      border: 1px solid #e5dfd6;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      z-index: 1000;
      overflow: hidden;
      display: none;
    }
    .queries-panel-header {
      padding: 15px 18px;
      border-bottom: 1px solid #e5dfd6;
      background: #fffbf5;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .queries-panel-body {
      max-height: calc(75vh - 120px);
      overflow-y: auto;
      padding: 0;
    }
    .chat-message {
      padding: 12px 15px;
      border-bottom: 1px solid #f1f5f9;
      position: relative;
    }
    .chat-message:hover {
      background: #f8fafc;
    }
    .chat-message.worker-message {
      background: #fef3c7;
      border-left: 3px solid #f59e0b;
    }
    .chat-message.owner-reply {
      background: #f0fdf4;
      border-left: 3px solid #22c55e;
      margin-left: 20px;
    }
    .message-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .message-sender {
      font-weight: 600;
      color: #b45309;
      font-size: 13px;
    }
    .message-time {
      font-size: 11px;
      color: #64748b;
    }
    .message-content {
      color: #334155;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 8px;
    }
    .message-actions {
      display: flex;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .chat-message:hover .message-actions {
      opacity: 1;
    }
    .btn-message-action {
      background: none;
      border: none;
      color: #64748b;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-message-action:hover {
      background: #e2e8f0;
      color: #334155;
    }
    .new-message-form {
      padding: 15px;
      border-top: 1px solid #e5dfd6;
      background: #fffbf5;
    }
    .message-input {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .message-textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      resize: vertical;
      min-height: 60px;
      margin-bottom: 8px;
    }
    .message-form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .btn-send-message {
      background: #b45309;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-cancel-message {
      background: #6b7280;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .query-card {
      background: #fffaf3;
      border: 1px solid #f0dfca;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .query-card.reply-pending {
      border-left: 4px solid #d97706;
    }
    .query-card.replied {
      border-left: 4px solid #0f766e;
      background: #f6fdfc;
    }
    .query-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      color: #8a6d52;
      font-size: 12px;
    }
    .query-subject {
      color: #b45309;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .query-message {
      color: #5f4b3a;
      font-size: 13px;
      margin-bottom: 10px;
      white-space: pre-wrap;
    }
    .query-reply {
      background: white;
      border: 1px solid #d7efe8;
      border-left: 4px solid #0f766e;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      color: #134e4a;
      white-space: pre-wrap;
    }
    .query-status {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .query-status.pending {
      color: #b45309;
    }
    .query-status.replied {
      color: #0f766e;
    }
    .query-help-text {
      color: #8a6d52;
      font-size: 13px;
      margin-top: -8px;
      margin-bottom: 16px;
    }
    @media (max-width: 768px) {
      .queries-panel {
        right: 12px;
        left: 12px;
        width: auto;
        top: 68px;
      }
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar navbar-custom">
    <div class="container-fluid">
      <div class="navbar-brand">
        <span style="margin-right: 10px;">✅</span> Chore Planner - Member
      </div>
      <div>
        <span style="color: white; margin-right: 20px; margin-left: 15px;">Welcome, <strong id="userEmail"></strong></span>
        <button class="btn-logout" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="dashboard-container">
    <!-- Welcome Section -->
    <div class="welcome-section">
      <h1>Your Tasks</h1>
      <p style="margin: 0; color: #6b6b6b;">Complete your assigned chores and keep the household running smoothly</p>
    </div>

    <!-- Stats Section -->
    <div class="stats-grid">
      <div class="stat-card">
        <h4 id="totalAssigned">0</h4>
        <p>Total Assigned</p>
      </div>
      <div class="stat-card">
        <h4 id="pendingCount">0</h4>
        <p>Pending Chores</p>
      </div>
      <div class="stat-card">
        <h4 id="completedCount">0</h4>
        <p>Completed Chores</p>
      </div>
    </div>

    <!-- Alert Messages -->
    <div id="alertMessage"></div>

    <!-- Filter Buttons -->
    <div class="btn-group-filter">
      <button class="btn-filter active" onclick="filterChores('ALL')">All</button>
      <button class="btn-filter" onclick="filterChores('PENDING')">Pending</button>
      <button class="btn-filter" onclick="filterChores('COMPLETED')">Completed</button>
    </div>

    <!-- Chores Card -->
    <div class="card-custom">
      <h3>📋 Your Assigned Chores</h3>
      <div id="choresList"></div>
    </div>


  </div>





  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

  <script src="/js/worker-dashboard.js"></script>
</body>
</html>
