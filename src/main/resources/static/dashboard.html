<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <div class="page full-screen">
    <header class="header">
      <div class="brand">
        <div class="logo"></div>
        <div>
          <h1 class="title">Dashboard</h1>
          <p class="subtitle">One place for owners and workers.</p>
        </div>
      </div>
      <span class="pill">Live view</span>
    </header>

    <main class="hero" style="align-items: start;">
      <section class="hero-panel">
        <h2 id="welcome" class="section-title"></h2>
        <p class="subtitle">Keep tasks moving and resolve issues quickly.</p>
        <div class="stat-grid">
          <div class="stat">
            <div class="value">12</div>
            <div class="subtitle">Open chores</div>
          </div>
          <div class="stat">
            <div class="value">6</div>
            <div class="subtitle">Completed today</div>
          </div>
          <div class="stat">
            <div class="value">3</div>
            <div class="subtitle">New queries</div>
          </div>
        </div>
      </section>

      <section class="hero-card">
        <div class="grid" style="grid-template-columns: 1fr;">
          <div id="ownerPanel" class="panel">
            <h3>Add chore</h3>
            <div class="stack">
              <div class="field">
                <label for="title">Title</label>
                <input id="title" placeholder="Title">
              </div>
              <div class="field">
                <label for="desc">Description</label>
                <input id="desc" placeholder="Description">
              </div>
              <div class="field">
                <label for="date">Date</label>
                <input id="date" type="date">
              </div>
              <div class="field">
                <label for="workerId">Assign to</label>
                <select id="workerId">
                  <option value="2">Worker 1</option>
                  <option value="3">Worker 2</option>
                  <option value="4">Worker 3</option>
                </select>
              </div>
              <button class="btn btn-primary" onclick="addChore()">Add chore</button>
            </div>
          </div>

          <div id="workerPanel" class="panel">
            <h3>Your chores</h3>
            <ul id="list"></ul>
            <div class="field">
              <label for="query">Any problem?</label>
              <textarea id="query" placeholder="Share issues or questions"></textarea>
            </div>
            <button class="btn btn-secondary" onclick="sendQuery()">Send query</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/script.js"></script>
</body>
</html>
