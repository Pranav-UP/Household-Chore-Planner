<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chore Planner Login</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    body.login-page {
      background: linear-gradient(135deg, rgba(15, 118, 110, 0.9) 0%, rgba(180, 83, 9, 0.9) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Sora", sans-serif;
    }
    .login-container {
      max-width: 520px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
    }
    .login-left {
      background: white;
      padding: 50px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .login-right {
      background: linear-gradient(135deg, #0f766e 0%, #0a5d56 100%);
      padding: 50px 40px;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .login-header h1 {
      font-size: 32px;
      font-weight: 700;
      color: #0f766e;
      margin-bottom: 8px;
    }
    .login-header p {
      color: #6b6b6b;
      margin: 0;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      font-weight: 500;
      color: #1c1c1c;
      margin-bottom: 8px;
      display: block;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #e5dfd6;
      border-radius: 8px;
      font-size: 16px;
      font-family: "Sora", sans-serif;
    }
    .form-group input:focus {
      outline: none;
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1);
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #0f766e, #0a5d56);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 16px;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(15, 118, 110, 0.2);
    }
    .register-link {
      text-align: center;
      margin-top: 20px;
      color: #6b6b6b;
    }
    .register-link a {
      color: #0f766e;
      text-decoration: none;
      font-weight: 600;
    }
    .alert {
      margin-bottom: 20px;
      border: none;
      border-radius: 8px;
    }
    .right-content h2 {
      font-size: 28px;
      margin-bottom: 30px;
      font-weight: 700;
    }
    .feature {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .feature-icon {
      font-size: 24px;
      flex-shrink: 0;
    }
    .feature-text p {
      margin: 0;
      line-height: 1.4;
      font-size: 14px;
    }
    .feature-text strong {
      display: block;
      font-size: 15px;
      margin-bottom: 4px;
    }
    @media (max-width: 768px) {
      .login-container {
        grid-template-columns: 1fr;
      }
      .login-right {
        display: none;
      }
      .login-left {
        padding: 40px 30px;
      }
    }
  </style>
</head>
<body class="login-page">
  <div class="login-container">
    <!-- Left Side: Login Form -->
    <div class="login-left">
      <div class="login-header">
        <h1>Chore Planner</h1>
        <p>Sign in to your account</p>
      </div>

      <form onsubmit="login(event)">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter your username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>
        <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
          <input type="checkbox" id="togglePassword">
          <label for="togglePassword" style="margin: 0; font-weight: 500;">Show password</label>
        </div>
        <button type="submit" class="btn-login">Sign In</button>
      </form>

      <div class="register-link">
        Don't have an account? <a href="register.html">Create one</a>
      </div>

      <hr style="margin: 30px 0; color: #e5dfd6;">

      <div style="background: #f9f7f3; padding: 16px; border-radius: 8px; font-size: 13px;">
        <strong style="color: #0f766e;">Demo Credentials:</strong>
        <p style="margin: 8px 0 0 0; color: #6b6b6b;">
          📌 Owner: <code>owner</code> / <code>Owner@123</code><br>
          👤 Worker: <code>worker1</code> / <code>Worker@123</code>
        </p>
      </div>
    </div>

  </div>

  <script src="/js/login.js?v=2"></script>
</body>
</html>
