<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Dashboard • Chore Planner</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    body { background:#f5f7fb; font-family: "Inter", system-ui, -apple-system, sans-serif; }
    .nav-gradient { background: linear-gradient(135deg,#0f766e,#0ea5e9); }
    .card { border: none; box-shadow: 0 12px 30px rgba(15,118,110,0.08); }
    .stat-card h6 { color:#6b7280; text-transform: uppercase; letter-spacing: 0.08em; font-size: 12px; }
    .stat-value { font-size: 30px; font-weight: 700; }
    .badge-priority-low { background:#e0f2fe; color:#0369a1; }
    .badge-priority-medium { background:#fef9c3; color:#b45309; }
    .badge-priority-high { background:#fee2e2; color:#b91c1c; }
    .status-chip { padding:6px 10px; border-radius: 999px; font-weight:600; font-size: 12px; }
    .status-pending { background:#fff7ed; color:#c2410c; }
    .status-completed { background:#ecfdf3; color:#15803d; }
    .status-overdue { background:#fee2e2; color:#b91c1c; }
    .due-today { background:#fef9c3; }
    .calendar-day { padding:10px 12px; border-radius:10px; background:#fff; border:1px solid #e5e7eb; margin-bottom:10px; }
    .calendar-day h6 { margin:0 0 6px 0; font-weight:700; }
    .table-responsive { max-height: 430px; }
    .chat-panel { position: fixed; right: 20px; bottom: 20px; width: 340px; max-height: 520px; background:#fff; border:1px solid #e5e7eb; border-radius:14px; box-shadow:0 12px 30px rgba(0,0,0,0.12); display:none; flex-direction:column; z-index:1050; }
    .chat-header { padding:12px 14px; border-bottom:1px solid #e5e7eb; display:flex; justify-content:space-between; align-items:center; }
    .chat-body { padding:12px; overflow-y:auto; flex:1; }
    .chat-input { padding:10px; border-top:1px solid #e5e7eb; }
    .bubble { max-width: 85%; padding:10px 12px; border-radius:12px; margin-bottom:8px; }
    .bubble.me { background:#0ea5e9; color:white; margin-left:auto; }
    .bubble.them { background:#f3f4f6; color:#111827; margin-right:auto; }
    .bubble small { display:block; color:rgba(255,255,255,0.8); }
    .bubble.them small { color:#6b7280; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg nav-gradient navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">Chore Planner • Owner</a>
      <div class="d-flex align-items-center gap-3">
        <span class="text-white small" id="userEmail"></span>
        <button class="btn btn-sm btn-light" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row g-3">
      <div class="col-6 col-md-3">
        <div class="card stat-card p-3">
          <h6>Total Chores</h6>
          <div class="stat-value" id="totalChores">0</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card stat-card p-3">
          <h6>Pending</h6>
          <div class="stat-value text-warning" id="pendingChores">0</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card stat-card p-3">
          <h6>Completed</h6>
          <div class="stat-value text-success" id="completedChores">0</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card stat-card p-3">
          <h6>Overdue</h6>
          <div class="stat-value text-danger" id="overdueChores">0</div>
        </div>
      </div>
    </div>

    <div class="row g-4 mt-1">
      <div class="col-lg-5">
        <div class="card p-4 h-100">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0">Add New Chore</h5>
          </div>
          <form id="choreForm" onsubmit="addChore(event)">
            <div class="mb-3">
              <label class="form-label">Chore Title</label>
              <input class="form-control" id="choreTitle" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" id="choreDescription" rows="2"></textarea>
            </div>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Due Date</label>
                <input type="date" class="form-control" id="choreDueDate" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Priority</label>
                <select class="form-select" id="chorePriority">
                  <option value="LOW">Low</option>
                  <option value="MEDIUM" selected>Medium</option>
                  <option value="HIGH">High</option>
                </select>
              </div>
            </div>
            <div class="mb-3 mt-3">
              <label class="form-label">Assign Worker</label>
              <select class="form-select" id="choreAssignee" required></select>
            </div>
            <button class="btn btn-primary w-100" type="submit">Create Chore</button>
          </form>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="card p-4 h-100">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
              <h5 class="mb-0">Chore Pipeline</h5>
              <small class="text-muted">Pending vs Completed</small>
            </div>
            <div class="input-group input-group-sm" style="width:260px;">
              <span class="input-group-text"><i class="fa fa-search"></i></span>
              <input class="form-control" id="searchInput" placeholder="Search by title or worker">
            </div>
          </div>
          <canvas id="statusChart" height="140"></canvas>
          <div class="d-flex gap-2 mt-3">
            <button class="btn btn-outline-secondary btn-sm filter-btn active" data-filter="ALL">All</button>
            <button class="btn btn-outline-warning btn-sm filter-btn" data-filter="PENDING">Pending</button>
            <button class="btn btn-outline-success btn-sm filter-btn" data-filter="COMPLETED">Completed</button>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-4 mt-1">
      <div class="col-lg-8">
        <div class="card p-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h5 class="mb-0">Chores</h5>
            <small class="text-muted">Click edit to reassign or change due date</small>
          </div>
          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>Title</th>
                  <th>Worker</th>
                  <th>Priority</th>
                  <th>Due</th>
                  <th>Status</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="choreTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="card p-3 h-100">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h5 class="mb-0">Calendar View</h5>
            <small class="text-muted">By due date</small>
          </div>
          <div id="calendarList" style="max-height:460px; overflow:auto;"></div>
        </div>
      </div>
    </div>

    <div class="alert alert-danger mt-3 d-none" id="alertMessage"></div>
    <div class="chat-panel" id="chatPanel">
      <div class="chat-header">
        <div>
          <div class="fw-semibold" id="chatTitle">Chat</div>
          <small class="text-muted" id="chatSubtitle"></small>
        </div>
        <button class="btn btn-sm btn-outline-secondary" onclick="toggleChat(false)">×</button>
      </div>
      <div class="chat-body" id="chatMessages"></div>
      <div class="chat-input">
        <div class="input-group input-group-sm">
          <input type="text" class="form-control" id="chatInput" placeholder="Type a message...">
          <button class="btn btn-primary" onclick="sendChat()">Send</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Edit Modal -->
  <div class="modal fade" id="editChoreModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Chore</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editChoreId">
          <div class="mb-2">
            <label class="form-label">Title</label>
            <input class="form-control" id="editChoreTitle">
          </div>
          <div class="mb-2">
            <label class="form-label">Description</label>
            <textarea class="form-control" id="editChoreDescription" rows="2"></textarea>
          </div>
          <div class="row g-2">
            <div class="col-md-6">
              <label class="form-label">Due Date</label>
              <input type="date" class="form-control" id="editChoreDueDate">
            </div>
            <div class="col-md-6">
              <label class="form-label">Priority</label>
              <select class="form-select" id="editChorePriority">
                <option value="LOW">Low</option>
                <option value="MEDIUM">Medium</option>
                <option value="HIGH">High</option>
              </select>
            </div>
          </div>
          <div class="mt-2">
            <label class="form-label">Assign Worker</label>
            <select class="form-select" id="editChoreAssignee"></select>
          </div>
          <div class="mt-2">
            <label class="form-label">Status</label>
            <select class="form-select" id="editChoreStatus">
              <option value="PENDING">Pending</option>
              <option value="COMPLETED">Completed</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary" onclick="saveChoreEdits()">Save changes</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="/js/sockjs.min.js"></script>
  <script src="/js/stomp.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/js/owner-dashboard.js"></script>
</body>
</html>
