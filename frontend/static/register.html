<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Chore Planner</title>
  <link rel="stylesheet" href="/style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0f766e 0%, #b45309 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Sora", sans-serif;
    }
    .register-container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 400px;
      width: 100%;
    }
    .register-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .register-header h1 {
      font-size: 28px;
      color: #141414;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .register-header p {
      color: #6b6b6b;
      margin: 0;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      font-weight: 500;
      color: #1c1c1c;
      margin-bottom: 8px;
      display: block;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #e5dfd6;
      border-radius: 8px;
      font-size: 14px;
      font-family: "Sora", sans-serif;
      transition: border-color 0.3s;
    }
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1);
    }
    .btn-register {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #0f766e, #0a5d56);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      font-size: 16px;
    }
    .btn-register:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(15, 118, 110, 0.2);
    }
    .login-link {
      text-align: center;
      margin-top: 20px;
      color: #6b6b6b;
    }
    .login-link a {
      color: #0f766e;
      text-decoration: none;
      font-weight: 600;
    }
    .alert {
      margin-bottom: 20px;
      border-radius: 8px;
      border: none;
    }
    .role-info {
      background: #f0f9f9;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      color: #0f766e;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="register-header">
      <h1>Create Account</h1>
      <p>Join Chore Planner today</p>
    </div>

    <div id="message" style="display:none;"></div>

    <form id="registerForm" onsubmit="register(event)">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter a strong password" required>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
      </div>

      <input type="hidden" id="role" value="WORKER">
      <div class="role-info">
        Owner account is fixed (pranavup.ec23@bitsathy.ac.in). You can register Worker accounts only.
      </div>

      <button type="submit" class="btn-register">Create Account</button>
    </form>

    <div class="login-link">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>

  <script src="/js/register.js"></script>
</body>
</html>
