<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chore Planner Login</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    body.login-page {
      background: linear-gradient(135deg, rgba(15, 118, 110, 0.9) 0%, rgba(180, 83, 9, 0.9) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Sora", sans-serif;
    }
    .login-container {
      max-width: 520px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
    }
    .login-left {
      background: white;
      padding: 50px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .login-right {
      background: linear-gradient(135deg, #0f766e 0%, #0a5d56 100%);
      padding: 50px 40px;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .login-header h1 {
      font-size: 32px;
      font-weight: 700;
      color: #0f766e;
      margin-bottom: 8px;
    }
    .login-header p {
      color: #6b6b6b;
      margin: 0;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      font-weight: 500;
      color: #1c1c1c;
      margin-bottom: 8px;
      display: block;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #e5dfd6;
      border-radius: 8px;
      font-size: 16px;
      font-family: "Sora", sans-serif;
    }
    .password-field {
      position: relative;
    }
    .password-field input {
      padding-right: 44px;
    }
    .password-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      padding: 4px;
      cursor: pointer;
      color: #6b6b6b;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .password-toggle:hover {
      color: #0f766e;
    }
    .password-toggle .icon-eye-off {
      display: none;
    }
    .password-toggle.is-visible .icon-eye {
      display: none;
    }
    .password-toggle.is-visible .icon-eye-off {
      display: inline-flex;
    }
    .form-group input:focus {
      outline: none;
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1);
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #0f766e, #0a5d56);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 16px;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(15, 118, 110, 0.2);
    }
    .register-link {
      text-align: center;
      margin-top: 20px;
      color: #6b6b6b;
    }
    .register-link a {
      color: #0f766e;
      text-decoration: none;
      font-weight: 600;
    }
    .alert {
      margin-bottom: 20px;
      border: none;
      border-radius: 8px;
    }
    .right-content h2 {
      font-size: 28px;
      margin-bottom: 30px;
      font-weight: 700;
    }
    .feature {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .feature-icon {
      font-size: 24px;
      flex-shrink: 0;
    }
    .feature-text p {
      margin: 0;
      line-height: 1.4;
      font-size: 14px;
    }
    .feature-text strong {
      display: block;
      font-size: 15px;
      margin-bottom: 4px;
    }
    @media (max-width: 768px) {
      .login-container {
        grid-template-columns: 1fr;
      }
      .login-right {
        display: none;
      }
      .login-left {
        padding: 40px 30px;
      }
    }
  </style>
</head>
<body class="login-page">
  <div class="login-container">
    <!-- Left Side: Login Form -->
    <div class="login-left">
      <div class="login-header">
        <h1>Chore Planner</h1>
        <p>Sign in to your account</p>
      </div>

      <form onsubmit="login(event)">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-field">
            <input type="password" id="password" placeholder="Enter your password" required>
            <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">
              <span class="icon-eye" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </span>
              <span class="icon-eye-off" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M2 2l20 20"></path>
                  <path d="M1 12s4-7 11-7c2.3 0 4.3.6 6 1.6"></path>
                  <path d="M21 12s-4 7-11 7c-2.3 0-4.3-.6-6-1.6"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </span>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-login">Sign In</button>
      </form>

      <div class="register-link">
        Don't have an account? <a href="register.html">Create one</a>
      </div>

      <hr style="margin: 30px 0; color: #e5dfd6;">
    </div>

  </div>

  <script src="/js/login.js?v=2"></script>
</body>
</html>
