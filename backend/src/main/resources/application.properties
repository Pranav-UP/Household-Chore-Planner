spring.config.import=optional:file:.env[.properties]

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:choredb}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=${SPRING_H2_CONSOLE_PATH:/h2-console}
server.error.include-message=always
server.port=${PORT:${SERVER_PORT:8080}}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_HIBERNATE_FORMAT_SQL:true}
spring.web.resources.static-locations=${SPRING_STATIC_LOCATIONS:file:../frontend/static/}

# Owner credentials (use environment variables in production)
app.owner.email=${APP_OWNER_EMAIL:pranavup.ec23@bitsathy.ac.in}
app.owner.password=${APP_OWNER_PASSWORD:1131}

# Security
spring.security.user.name=${SPRING_SECURITY_USER_NAME:admin}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:admin}
