spring.config.import=optional:file:.env[.properties]

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:choredb}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=${PORT:8080}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.owner.email=${APP_OWNER_EMAIL:pranavup.ec23@bitsathy.ac.in}
app.owner.password=${APP_OWNER_PASSWORD:1131}

spring.security.user.name=admin
spring.security.user.password=admin

spring.web.resources.static-locations=${SPRING_STATIC_LOCATIONS:classpath:/static/}
